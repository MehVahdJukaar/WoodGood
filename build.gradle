// --- Utils
static def listGameVersions(String minVersion, String maxVersion) {
// minVersion like "1.20", maxVersion like "1.20.4"
    def versions = []
    versions << minVersion
    int endPatch = Integer.parseInt(maxVersion.split('\\.')[2])
    for (int i = 1; i <= endPatch; i++) {
        versions << "${minVersion}.${i}"
    }
    return versions
}

