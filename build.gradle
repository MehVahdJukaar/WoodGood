plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10.+" apply false
    id "me.modmuss50.mod-publish-plugin" version "0.8.+" apply false
    id "com.modrinth.minotaur" version "2.+"
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = mod_id
    version = mod_version
    group = mod_group_id

    repositories {

        mavenLocal()
        mavenCentral()

        // Flat directory for local mods
        flatDir { dirs "mods" }

        // Our publishing repo
        if (!maven_backup.toBoolean()) maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" }

        maven { url = "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://mvn.devos.one/snapshots/" } // registrate_fabric & registrate
        maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config

        // Required for Create
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.tterrag.com" } // Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        maven { url = "https://squiddev.cc/maven" } // CC: Tweaked
        maven { url = 'https://maven.ladysnake.org/releases' } // Unknown
        maven { url = "https://maven.shedaniel.me" } // unknown
        maven { url = "https://maven.blamejared.com/" } // JEI
        maven { url = "https://modmaven.dev" } // Botania & FALLBACK for JEI
        maven { url = "https://maven.teamresourceful.com/repository/maven-public/" } // Chipped
        maven { url = 'https://maven.minecraftforge.net/' } // Terrablender
        maven { url = "https://maven.terraformersmc.com/" } // EMI
        maven { url = "https://maven.terraformersmc.com/releases" }

        maven { // Reach Entity Attributes
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content { includeGroup("com.jamieswhiteshirt") }
        }

        maven { // Geckolib
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

