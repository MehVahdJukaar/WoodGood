plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.6.+" apply false
    id 'io.github.juuxel.loom-quiltflower' version '1.7.1' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()

        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven { url = "https://api.modrinth.com/maven" }

//        maven { url = "https://maven.firstdark.dev/releases" } // mod-publish-plugin

        maven { url = "https://mvn.devos.one/snapshots/" }

        maven { url = "https://jitpack.io/" } // for Porting Lib: Mixin Extras, Fabric ASM

        maven {
            name = "Ladysnake Mods"
            url = 'https://maven.ladysnake.org/releases'
        }
    }

    subprojects {
        apply plugin: "dev.architectury.loom"
        apply plugin: "io.github.juuxel.loom-quiltflower"
        apply plugin: "me.modmuss50.mod-publish-plugin"

        loom {
            silentMojangMappingsLicense()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
            // The following line declares the mojmap mappings, you may use other mappings as well
            mappings loom.layered() {
                it.parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
                it.officialMojangMappings {
                    setNameSyntheticMembers(false)
                }
            }
        }

        var env = System.getenv()
        var modLoader = name

        var changelogFile = rootProject.file("changelog.md")
        var changelogText = changelogFile.exists() ? changelogFile.text : ""

        publishMods {
            dryRun = false
            file = tasks.remapJar.archiveFile
            changelog = changelogText
            version = mod_version + "-" + modLoader
            type = release_type == "beta" ? BETA : (release_type == "alpha" ? ALPHA : STABLE)
            displayName = mod_id + "-" + mod_version + "-" + modLoader
            modLoaders.add(modLoader)

            if (env.MODRINTH_TOKEN) {
                modrinth {
                    accessToken = env.MODRINTH_TOKEN
                    projectId = "${modrinth_id}"
                    environment = CLIENT_AND_SERVER

                    minecraftVersions.add("${minecraft_version}")

                    if (modLoader == "fabric") {
                        dependencies {
                            requires("fabric-api")
                            requires("moonlight")
                        }
                    } else {
                        dependencies {
                            requires("moonlight")
                        }
                    }
                }
            }

            if (env.CURSEFORGE_TOKEN) {
                curseforge {
                    accessToken = env.CURSEFORGE_TOKEN
                    projectId = curseforge_id

                    minecraftVersions.add("${minecraft_version}")

                    clientRequired = true
                    serverRequired = true

                    if (modLoader == "fabric") {
                        requires("fabric-api")
                        requires("selene")
                        optional("another-furniture")
                        optional("architects-palette-fabric")
                        optional("beautify-refabricated")
                        optional("bewitchment")
                        optional("camp-chair")
                        optional("chipped")
                        optional("cozy")
                        optional("create-fabric")
                        optional("decorative-blocks")
                        optional("dramatic-doors")
                        optional("exlines-bark-carpets")
                        optional("farmers-delight-fabric")
                        optional("friends-and-foes")
                        optional("furnish")
                        optional("handcrafted")
                        optional("hearth-and-home")
                        optional("infinitybuttons")
                        optional("macaws-bridges")
                        optional("macaws-doors")
                        optional("macaws-fences-and-walls")
                        optional("macaws-furniture")
                        optional("macaws-lights-and-lamps")
                        optional("macaws-paths-and-pavings")
                        optional("macaws-roofs")
                        optional("macaws-trapdoors")
                        optional("macaws-windows")
                        optional("missing-wilds")
                        optional("red-bits")
                        optional("refurbished-furniture")
                        optional("table-top-craft-fabric")
                        optional("the-twilight-forest")
                        optional("twigs")
                    } else {
                        requires("selene")
                        optional("another-furniture")
                        optional("architects-palette")
                        optional("beautify-decorate")
                        optional("backpacked")
                        optional("builders-delight-forge")
                        optional("buildersaddition")
                        optional("camp-chair")
                        optional("chipped")
                        optional("create")
                        optional("decorative-blocks")
                        optional("domum-ornamentum")
                        optional("dramatic-doors")
                        optional("exnihilosequentia")
                        optional("exlines-bark-carpets")
                        optional("farmers-delight")
                        optional("friends-and-foes-forge")
                        optional("furnish")
                        optional("habitat")
                        optional("handcrafted")
                        optional("infinitybuttons")
                        optional("lauchs-shutters")
                        optional("macaws-bridges")
                        optional("macaws-doors")
                        optional("macaws-fences-and-walls")
                        optional("macaws-furniture")
                        optional("macaws-lights-and-lamps")
                        optional("macaws-paths-and-pavings")
                        optional("macaws-roofs")
                        optional("macaws-trapdoors")
                        optional("macaws-windows")
                        optional("mighty-mail")
                        optional("missing-wilds-forge")
                        optional("mosaic-carpentry")
                        optional("mrcrayfish-furniture-mod")
                        optional("pokecube-aoi")
                        optional("premium-wood")
                        optional("productivebees")
                        optional("quark")
                        optional("rechiseled")
                        optional("refurbished-furniture")
                        optional("storage-drawers")
                        optional("table-top-craft")
                        optional("the-twilight-forest")
                        optional("twigs")
                        optional("valhelsia-structures")
                        optional("woodworks")
                        optional("workshop-for-handsome-adventurer")
                        optional("xercamod")
                    }
                }
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}
