plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "com.modrinth.minotaur" version "2.+"
    id "com.github.johnrengelman.shadow" version "7.1.2" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.matthewprenger.cursegradle"
    apply plugin: "com.modrinth.minotaur"
    apply plugin: "com.github.johnrengelman.shadow"


    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.layered() {
            it.officialMojangMappings {
                setNameSyntheticMembers(false)
            }
            it.parchment("org.parchmentmc.data:parchment-${parchment_version}")
        }
    }

    var env = System.getenv()
    var modLoader = name

    var changelogFile = rootProject.file("changelog.md")
    var changelogText = changelogFile.exists() ? changelogFile.text : ""

    if (env.MODRINTH_TOKEN) {
        modrinth {
            projectId = "${modrinth_id}"
            uploadFile = tasks.remapJar
            additionalFiles.add(tasks.remapSourcesJar)
            gameVersions = [minecraft_version]
            loaders = [modLoader]
            changelog = changelogText
            versionNumber = mod_version+'-'+modLoader

            if (modLoader == "fabric") {
                dependencies {
                    required.project "fabric-api"
                    required.project "moonlight"
                    optional.project "gems-realm"
                    optional.project "stone-zone"
                }
            //!! FORGE
            } else {
                dependencies {
                    required.project "moonlight"
                    optional.project "gems-realm"
                    optional.project "stone-zone"
                }
            }
        }
    }

    if (env.CURSEFORGE_TOKEN) {
        curseforge {
            apiKey = env.CURSEFORGE_TOKEN
            project {
                id = curseforge_id
                changelog = changelogText
                changelogType = 'markdown'
                releaseType = 'release'
                addGameVersion minecraft_version
                addGameVersion modLoader.capitalize()

                mainArtifact(tasks.remapJar) {
                    if (modLoader == "fabric") {
                        displayName = mod_id +"-LS-"+ mod_version + "-fabric"
                    }
                }

                if (modLoader == "fabric") {
                    relations {
                        requiredDependency "fabric-api"
                        requiredDependency "selene"
                        optionalDependency "stone-zone"
                        optionalDependency "gems-realm"
                    }
                //!! FORGE
                } else {
                    relations {
                        incompatible("vminus")
                        requiredDependency("selene")
                    }
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {

        mavenLocal()

        flatDir {
            dirs 'mods'
        }

        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven { url = "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }
        maven { url = "https://api.modrinth.com/maven" }

        maven { url = "https://mvn.devos.one/snapshots/" } // registrate_fabric & registrate

        maven { url = "https://mvn.devos.one/releases" } // Porting Lib Releases

        maven { url = "https://maven.shedaniel.me/" } // Cloth Config

        // Required for Create
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel

        maven { url = "https://maven.tterrag.com" } // Registrate

        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port

        maven { // Reach Entity Attributes
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content { includeGroup("com.jamieswhiteshirt") }
        }
        maven { url = "https://squiddev.cc/maven" } // CC: Tweaked

        maven { url = 'https://maven.ladysnake.org/releases' } // Unknown

        maven { url = "https://maven.shedaniel.me" } // unknown

        maven { url = "https://maven.blamejared.com/" } // JEI

        maven { url = "https://modmaven.dev" } // Botania & FALLBACK for JEI

        maven { url = "https://maven.teamresourceful.com/repository/maven-public/" } // Chipped

        maven { url = 'https://maven.minecraftforge.net/' } // Terrablender

        maven { url = "https://maven.terraformersmc.com/" } // EMI

        maven { url = "https://maven.terraformersmc.com/releases" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}
