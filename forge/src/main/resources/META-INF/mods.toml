
modLoader="javafml" #mandatory
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mods]] #mandatory
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''${mod_description}'''
modUrl = "${mod_homepage}"
itemIcon = "everycomp:all_woods" #catalogue icon


[[dependencies.${mod_id}]] #optional
modId="forge" #mandatory
mandatory=true #mandatory
versionRange="[41.0.100,)" #mandatory
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange = "[${minecraft_min_version},${minecraft_max_version})"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="moonlight"
mandatory=true
versionRange = "[${moonlight_required_version},]"
ordering="NONE"
side="BOTH"

